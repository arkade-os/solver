name: ci_integration

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'

jobs:
  test:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.26.1'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run arkade-regtest
        run: node regtest/regtest.mjs start

      - name: Run arkd stack
        run: make docker-run

      - name: Run integration tests
        run: make integrationtest

      - name: Capture arkd logs
        if: failure()
        run: |
          echo "=== arkd logs ==="
          docker logs solverd-arkd || true
          echo "=== arkd-wallet logs ==="
          docker logs solverd-arkd-wallet || true
          echo "=== nbxplorer logs ==="
          docker logs solverd-nbxplorer || true
          echo "=== emulator logs ==="
          docker logs solverd-emulator || true

      - name: Tear down
        if: always()
        run: make docker-stop

      - name: Stop arkade-regtest
        if: always()
        run: node regtest/regtest.mjs clean
