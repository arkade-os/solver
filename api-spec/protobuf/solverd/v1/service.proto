syntax = "proto3";
package solverd.v1;
option go_package = "github.com/arkade-os/solver/api-spec/protobuf/gen/solverd/v1";

import "google/api/annotations.proto";

service SwapService {
  rpc AddMarket(AddMarketRequest) returns (AddMarketResponse) {
    option (google.api.http) = { post: "/v1/market" body: "*" };
  }
  rpc UpdateMarket(UpdateMarketRequest) returns (UpdateMarketResponse) {
    option (google.api.http) = { put: "/v1/market" body: "*" };
  }
  rpc RemoveMarket(RemoveMarketRequest) returns (RemoveMarketResponse) {
    option (google.api.http) = { delete: "/v1/market/{base_asset}/{quote_asset}" };
  }
  rpc ListMarkets(ListMarketsRequest) returns (ListMarketsResponse) {
    option (google.api.http) = { get: "/v1/markets" };
  }
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (google.api.http) = { get: "/v1/status" };
  }
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse) {
    option (google.api.http) = { get: "/v1/trades" };
  }
}

message MarketInfo {
  string base_asset = 1;
  string quote_asset = 2;
  int32 base_decimals = 3;
  int32 quote_decimals = 4;
  // Sell-base bounds (deposit base, want quote). max_quote_amount == 0 disables.
  uint64 min_quote_amount = 5;
  uint64 max_quote_amount = 6;
  // Buy-base bounds (deposit quote, want base). max_base_amount == 0 disables.
  uint64 min_base_amount = 7;
  uint64 max_base_amount = 8;
  string price_feed = 9; // returns quote-per-base
  // Max price deviation from the feed, in basis points (100 = 1%). 0 = server default (10 bps).
  uint32 slippage_bps = 10;
  // Solver margin in basis points, shifted into the accepted price. 0 = no fee.
  uint32 fee_bps = 11;
}

message AddMarketRequest { MarketInfo market = 1; }
message AddMarketResponse { MarketInfo market = 1; }
message UpdateMarketRequest { MarketInfo market = 1; }
message UpdateMarketResponse { MarketInfo market = 1; }
message RemoveMarketRequest { string base_asset = 1; string quote_asset = 2; }
message RemoveMarketResponse {}
message ListMarketsRequest {}
message ListMarketsResponse { repeated MarketInfo markets = 1; }
message GetStatusRequest {}
message GetStatusResponse { bool running = 1; }

message TradeInfo {
  int64 id = 1;
  string market = 2;
  string deposit_asset = 3;
  uint64 deposit_amount = 4;
  string want_asset = 5;
  uint64 want_amount = 6;
  string offer_txid = 7;
  string fulfill_txid = 8;
  int64 created_at = 9;
}

message ListTradesRequest {
  int32 limit = 1;
}

message ListTradesResponse {
  repeated TradeInfo trades = 1;
}
