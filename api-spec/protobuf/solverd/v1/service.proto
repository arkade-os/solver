syntax = "proto3";
package solverd.v1;
option go_package = "github.com/arkade-os/solver/api-spec/protobuf/gen/solverd/v1";

import "google/api/annotations.proto";

service BancoService {
  rpc AddPair(AddPairRequest) returns (AddPairResponse) {
    option (google.api.http) = { post: "/v1/pair" body: "*" };
  }
  rpc UpdatePair(UpdatePairRequest) returns (UpdatePairResponse) {
    option (google.api.http) = { put: "/v1/pair" body: "*" };
  }
  rpc RemovePair(RemovePairRequest) returns (RemovePairResponse) {
    option (google.api.http) = { delete: "/v1/pair/{pair}" };
  }
  rpc ListPairs(ListPairsRequest) returns (ListPairsResponse) {
    option (google.api.http) = { get: "/v1/pairs" };
  }
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (google.api.http) = { get: "/v1/status" };
  }
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse) {
    option (google.api.http) = { get: "/v1/trades" };
  }
}

message PairInfo {
  string pair = 1;
  // Min/max trade size on the base side of the trade (the maker's deposit),
  // expressed in base-asset atomic units (sats only when the base is BTC).
  uint64 min_base_amount = 2;
  uint64 max_base_amount = 3;
  string price_feed = 4;
  bool invert_price = 5;
  // Internal fill-time max price deviation from the feed, in basis points
  // (100 = 1%). 0 means the server default of 100 bps. Never published in the
  // discovery card.
  uint32 tolerance_bps = 6;
  int32 base_decimals = 7;
  int32 quote_decimals = 8;
  // Published spread promised to makers, in basis points. Must be lower than
  // the effective tolerance_bps.
  uint32 fee_bps = 9;
}

message AddPairRequest { PairInfo pair = 1; }
message AddPairResponse { PairInfo pair = 1; }
message UpdatePairRequest { PairInfo pair = 1; }
message UpdatePairResponse { PairInfo pair = 1; }
message RemovePairRequest { string pair = 1; }
message RemovePairResponse {}
message ListPairsRequest {}
message ListPairsResponse { repeated PairInfo pairs = 1; }
message GetStatusRequest {}
message GetStatusResponse { bool running = 1; }

message TradeInfo {
  int64 id = 1;
  string pair = 2;
  string deposit_asset = 3;
  uint64 deposit_amount = 4;
  string want_asset = 5;
  uint64 want_amount = 6;
  string offer_txid = 7;
  string fulfill_txid = 8;
  int64 created_at = 9;
}

message ListTradesRequest {
  int32 limit = 1;
}

message ListTradesResponse {
  repeated TradeInfo trades = 1;
}
