syntax = "proto3";
package solverd.v1;
option go_package = "github.com/arkade-os/solver/api-spec/protobuf/gen/solverd/v1";

import "google/api/annotations.proto";

service SwapService {
  rpc AddMarket(AddMarketRequest) returns (AddMarketResponse) {
    option (google.api.http) = { post: "/v1/market" body: "*" };
  }
  rpc UpdateMarket(UpdateMarketRequest) returns (UpdateMarketResponse) {
    option (google.api.http) = { put: "/v1/market" body: "*" };
  }
  rpc RemoveMarket(RemoveMarketRequest) returns (RemoveMarketResponse) {
    option (google.api.http) = { delete: "/v1/market/{base_asset}/{quote_asset}" };
  }
  rpc ListMarkets(ListMarketsRequest) returns (ListMarketsResponse) {
    option (google.api.http) = { get: "/v1/markets" };
  }
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option (google.api.http) = { get: "/v1/status" };
  }
  rpc ListTrades(ListTradesRequest) returns (ListTradesResponse) {
    option (google.api.http) = { get: "/v1/trades" };
  }
  rpc GetRegistryCard(GetRegistryCardRequest) returns (RegistryCard) {
    option (google.api.http) = { get: "/v1/card" };
  }
}

message MarketInfo {
  string base_asset = 1;
  string quote_asset = 2;
  int32 base_decimals = 3;
  int32 quote_decimals = 4;
  // Sell-base bounds (deposit base, want quote). max_quote_amount == 0 disables.
  uint64 min_quote_amount = 5;
  uint64 max_quote_amount = 6;
  // Buy-base bounds (deposit quote, want base). max_base_amount == 0 disables.
  uint64 min_base_amount = 7;
  uint64 max_base_amount = 8;
  string price_feed = 9; // returns quote-per-base
  // Max price deviation from the feed, in basis points (100 = 1%). 0 = server default (10 bps).
  uint32 tolerance_bps = 10;
  // Solver margin in basis points, shifted into the accepted price. 0 = no fee.
  uint32 fee_bps = 11;
  // JSON pointer to the price in the feed response, e.g. "/bitcoin/usd".
  // Empty = guess from the feed host (Binance / CoinGecko).
  string price_path = 12;
  // How long a fetched feed price stays usable, in seconds.
  // 0 = server default (15s).
  uint32 price_ttl_seconds = 13;
}

message AddMarketRequest { MarketInfo market = 1; }
message AddMarketResponse { MarketInfo market = 1; }
message UpdateMarketRequest { MarketInfo market = 1; }
message UpdateMarketResponse { MarketInfo market = 1; }
message RemoveMarketRequest { string base_asset = 1; string quote_asset = 2; }
message RemoveMarketResponse {}
message ListMarketsRequest {}
message ListMarketsResponse { repeated MarketInfo markets = 1; }
message GetStatusRequest {}
message GetStatusResponse { bool running = 1; }

message TradeInfo {
  int64 id = 1;
  string market = 2;
  string deposit_asset = 3;
  uint64 deposit_amount = 4;
  string want_asset = 5;
  uint64 want_amount = 6;
  string offer_txid = 7;
  string fulfill_txid = 8;
  int64 created_at = 9;
  // empty on a fulfilled trade, otherwise the reason the offer was rejected
  // or the fulfillment failed
  string error = 10;
}

message ListTradesRequest {
  int32 limit = 1;
  // filter by outcome: "" = all, "failed", or "succeeded"
  string status = 2;
}

message ListTradesResponse {
  repeated TradeInfo trades = 1;
}

message GetRegistryCardRequest { string name = 1; }

// RegistryCard mirrors the solver-registry card.schema.json. Every field
// carries an explicit json_name so protojson emits the exact registry keys,
// and numeric fields are int32/uint32 so they serialize as JSON numbers.
message RegistryCard {
  int32 version = 1 [json_name = "version"];
  string name = 2 [json_name = "name"];
  repeated RegistryMarket markets = 3 [json_name = "markets"];
}

message RegistryMarket {
  string pair = 1 [json_name = "pair"];
  RegistryAsset base_asset = 2 [json_name = "base_asset"];
  RegistryAsset quote_asset = 3 [json_name = "quote_asset"];
  string price_feed = 4 [json_name = "price_feed"];
  RegistryPriceFeedSchema price_feed_schema = 5 [json_name = "price_feed_schema"];
  int32 price_decimals = 6 [json_name = "price_decimals"];
  uint32 fee_bps = 7 [json_name = "fee_bps"];
  string min_base_amount = 8 [json_name = "min_base_amount"];
  string max_base_amount = 9 [json_name = "max_base_amount"];
  string min_quote_amount = 10 [json_name = "min_quote_amount"];
  string max_quote_amount = 11 [json_name = "max_quote_amount"];
}

message RegistryAsset {
  string id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string ticker = 3 [json_name = "ticker"];
  int32 decimals = 4 [json_name = "decimals"];
}

message RegistryPriceFeedSchema {
  string type = 1 [json_name = "type"];
  string price_path = 2 [json_name = "price_path"];
}
