services:
  pgnbxplorer:
    restart: unless-stopped
    image: postgres:16
    container_name: solverd-pgnbxplorer
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nbxplorer -h 127.0.0.1 -p 5432"]
      interval: 2s
      timeout: 2s
      retries: 30

  nbxplorer:
    restart: unless-stopped
    container_name: solverd-nbxplorer
    image: nicolasdorier/nbxplorer:2.6.7
    environment:
      - NBXPLORER_NETWORK=regtest
      - NBXPLORER_CHAINS=btc
      - NBXPLORER_BTCRPCURL=http://bitcoin:18443
      - NBXPLORER_BTCNODEENDPOINT=bitcoin:18444
      - NBXPLORER_BTCRPCUSER=admin1
      - NBXPLORER_BTCRPCPASSWORD=123
      - NBXPLORER_VERBOSE=1
      - NBXPLORER_BIND=0.0.0.0:32838
      - NBXPLORER_TRIMEVENTS=10000
      - NBXPLORER_SIGNALFILESDIR=/datadir
      - NBXPLORER_POSTGRES=User ID=postgres;Host=solverd-pgnbxplorer;Port=5432;Application Name=nbxplorer;MaxPoolSize=20;Database=nbxplorer
      - NBXPLORER_EXPOSERPC=1
      - NBXPLORER_NOAUTH=1
    volumes:
      - type: tmpfs
        target: /datadir
    depends_on:
      pgnbxplorer:
        condition: service_healthy

  arkd-wallet:
    restart: unless-stopped
    image: ghcr.io/arkade-os/arkd-wallet:v0.9.9
    container_name: solverd-arkd-wallet
    depends_on:
      - nbxplorer
    ports:
      - "6160:6060"
    environment:
      - ARKD_WALLET_LOG_LEVEL=5
      - ARKD_WALLET_NBXPLORER_URL=http://solverd-nbxplorer:32838
      - ARKD_WALLET_NETWORK=regtest
      - ARKD_WALLET_SIGNER_KEY=1822f98b3a7366532d3a875fa94c97948fe8f6a71a0ca1e94587be5f4ce646d1
    volumes:
      - type: tmpfs
        target: /app/data

  arkd:
    image: ghcr.io/arkade-os/arkd:v0.9.9
    container_name: solverd-arkd
    restart: unless-stopped
    depends_on:
      - arkd-wallet
    ports:
      - "7070:7070"
      - "7071:7071"
    environment:
      - ARKD_LOG_LEVEL=5
      - ARKD_NO_MACAROONS=true
      - ARKD_VTXO_TREE_EXPIRY=40
      - ARKD_UNILATERAL_EXIT_DELAY=20
      - ARKD_PUBLIC_UNILATERAL_EXIT_DELAY=20
      - ARKD_BOARDING_EXIT_DELAY=30
      - ARKD_CHECKPOINT_EXIT_DELAY=10
      - ARKD_WALLET_ADDR=solverd-arkd-wallet:6060
      - ARKD_ESPLORA_URL=http://chopsticks:3000
      - ARKD_VTXO_MIN_AMOUNT=1
      - ARKD_LIVE_STORE_TYPE=inmemory
      - ARKD_EVENT_DB_TYPE=badger
      - ARKD_DB_TYPE=sqlite
      - ARKD_SESSION_DURATION=30
    volumes:
      - type: tmpfs
        target: /app/data

  emulator:
    image: ghcr.io/arkade-os/emulator:v0.0.3
    container_name: solverd-emulator
    restart: unless-stopped
    depends_on:
      - arkd
    ports:
      - "7173:7073"
    environment:
      - EMULATOR_SECRET_KEY=f40f6e7a5cf262f4093d4605b8f40cbaf9da9e59bf32f24bb27a4ffc74f71eab
      - EMULATOR_NO_TLS=true
      - EMULATOR_LOG_LEVEL=5
      - EMULATOR_ARKD_URL=solverd-arkd:7070
    volumes:
      - type: tmpfs
        target: /app/data

  solverd-pricefeed:
    image: nginx:alpine
    container_name: solverd-pricefeed
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./pricefeed:/usr/share/nginx/html:ro

  solverd:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: solverd-solverd
    restart: unless-stopped
    depends_on:
      - arkd
      - emulator
      - solverd-pricefeed
    ports:
      - "7170:7170"
      - "7171:7171"
    environment:
      - SOLVER_ARK_URL=solverd-arkd:7070
      - SOLVER_EMULATOR_URL=solverd-emulator:7073
      - SOLVER_EXPLORER_URL=http://chopsticks:3000
      - SOLVER_WALLET_SEED=ed1f6ad1c0aa1bbdcc14a4dc26ff5d31cca6df11617f2bbb24a4e0e6f72f7a5d
      - SOLVER_WALLET_PASSWORD=password
      - SOLVER_LOG_LEVEL=5
    volumes:
      - type: tmpfs
        target: /app/data

networks:
  default:
    name: nigiri
    external: true
